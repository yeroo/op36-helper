[package]
name = "op36-helper"
version = "0.2.6"
edition = "2024"
description = "On-screen layout helper for the Ergohaven OmegaPoint36 keyboard"
publish = false

[[bin]]
name = "op36-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
simplelog = "0.12"
dirs = "7"
rmk-types = { path = "../rmk/rmk-types" }
postcard = { version = "1", features = ["use-std"] }
png = "0.18"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Foundation_Numerics",
] }
windows-numerics = "0.3"
hidapi = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Pure-Rust hidraw backend: no libudev headers needed to build.
hidapi = { version = "2", default-features = false, features = ["linux-native-basic-udev"] }
x11rb = { version = "0.14", features = ["randr", "shape", "xkb"] }
tiny-skia = "0.12"
ab_glyph = { version = "0.2", features = ["variable-fonts"] }
fontdb = "0.24"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
evdev = "0.13"
xkbcommon = { version = "0.9", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-manifest = "1.5"
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[package]
name = "op36-helper"
version = "0.2.4"
edition = "2024"
description = "On-screen layout helper for the Ergohaven OmegaPoint36 keyboard"
publish = false

[[bin]]
name = "op36-helper"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Foundation_Numerics",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
simplelog = "0.12"
dirs = "7"
rmk-types = { path = "../rmk/rmk-types" }
postcard = { version = "1", features = ["use-std"] }
hidapi = "2"
windows-numerics = "0.3"
png = "0.18"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-manifest = "1.5"
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
